[package]
name = "docucraft-a4"
version = "1.0.0"
description = "DocuCraft A4 - Markdown to Printed A4 Document Generator"
authors = ["DocuCraft Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
