name: Release Tauri Apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - macos-latest
          - ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Install dependencies
        run: npm install

      - name: Sync Tauri version
        run: node scripts/sync-tauri-version.cjs

      - name: Build and release
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SangDocCraft ${{ github.ref_name }}"
          releaseBody: "See attached assets for installers."
          releaseDraft: false
          prerelease: false

      - name: Inspect Tauri bundles
        if: always()
        shell: bash
        run: find src-tauri/target -type f -path "*/bundle/*" -print

  build-cli:
    name: Build CLI distribution
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and package CLI
        working-directory: cli
        run: |
          npm install
          npm run build
          mkdir sdc-authoring
          cp -R dist/. sdc-authoring/
          zip -qr sdc-authoring.zip sdc-authoring

      - name: Attach CLI package to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: cli/sdc-authoring.zip
          overwrite_files: true
          fail_on_unmatched_files: true
